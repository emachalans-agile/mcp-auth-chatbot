<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auth Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0;
  }
  .chat-container {
    width: 420px; height: 640px;
    background: #1e293b;
    border-radius: 16px;
    display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .header {
    padding: 16px;
    background: #334155;
    color: #f1f5f9;
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .status {
    font-size: 12px; padding: 4px 10px; border-radius: 12px;
    background: #ef4444; color: white;
  }
  .status.ok { background: #22c55e; }
  .messages {
    flex: 1; padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 12px;
    font-size: 14px; line-height: 1.4; white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #3b82f6; color: white; }
  .bot  { align-self: flex-start; background: #475569; color: #f1f5f9; }
  .input-row {
    display: flex; padding: 12px; background: #334155; gap: 8px;
  }
  input {
    flex: 1; padding: 10px 14px; border-radius: 8px; border: none;
    outline: none; background: #1e293b; color: white; font-size: 14px;
  }
  button {
    padding: 10px 18px; border: none; border-radius: 8px;
    background: #3b82f6; color: white; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <span>💬 Auth Chatbot</span>
    <span id="status" class="status">Not Verified</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-row">
    <input id="input" placeholder="Type your email to start..." autofocus />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "http://localhost:8000";
let sessionId = null;
let authenticated = false;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const statusEl = document.getElementById("status");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, "user");
  inputEl.value = "";

  try {
    const res = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });
    const data = await res.json();
    sessionId = data.session_id;
    authenticated = data.authenticated;
    addMessage(data.reply, "bot");
    statusEl.textContent = authenticated ? "Verified" : "Not Verified";
    statusEl.className = "status" + (authenticated ? " ok" : "");
  } catch (e) {
    addMessage("⚠️ Server error: " + e.message, "bot");
  }
}

inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

// Greeting
addMessage("👋 Hi! Please share your email ID to continue.", "bot");
</script>
</body>
</html>
